<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Desk</title><link rel="stylesheet" href="style.css"></head>
<body>
<h1>Trade Desk</h1>
<div id="auth" hidden>
  <input id="email" type="email" placeholder="email"><input id="pw" type="password" placeholder="password">
  <button id="login">Sign in</button>
</div>
<div id="main" hidden>
  <button id="link">Link cTrader account(s)</button><button id="refresh">Refresh</button><button id="logout">Sign out</button>
  <div id="msg"></div>
  <table><thead><tr><th>Account</th><th>Type</th><th>Balance</th><th>Equity</th><th>Open trades</th><th>Pending</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
